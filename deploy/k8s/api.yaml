apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector:
    app: api
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: gitcastle-api:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: HTTP_ADDR
              value: ":8080"
            - name: REPOSITORY_ROOT
              value: /var/lib/gitcastle/repositories
            - name: DATABASE_URL
              value: postgres://gitcastle:change-me@postgres:5432/gitcastle?sslmode=disable
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: repositories
              mountPath: /var/lib/gitcastle/repositories
      volumes:
        - name: repositories
          persistentVolumeClaim:
            claimName: repositories-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: repositories-data
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 20Gi
