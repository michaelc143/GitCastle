services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gitcastle
      POSTGRES_PASSWORD: gitcastle
      POSTGRES_DB: gitcastle
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gitcastle -d gitcastle"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgres://gitcastle:gitcastle@postgres:5432/gitcastle?sslmode=disable
      HTTP_ADDR: :8080
      REPOSITORY_ROOT: /var/lib/gitcastle/repositories
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - repositories-data:/var/lib/gitcastle/repositories

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  postgres-data:
  repositories-data:
